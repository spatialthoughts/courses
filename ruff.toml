# Lint the course code (scripts and notebooks). Generated site output is excluded.
extend-exclude = [
    "docs",
    "*-output",
    # PyQGIS code relies on QGIS console globals like `iface`
    "code/pyqgis",
    "code/qgis_actions",
    "code/qgis_plugin_workshop",
    "code/advanced_qgis",
]

[lint]
# Pyflakes + core pycodestyle errors only. Notebook imports often sit in
# later cells, so allow imports that are not at the top of the file.
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]
